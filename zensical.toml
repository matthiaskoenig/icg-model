[project]
site_name = "Physiologically based pharmacokinetic (PBPK) model of indocyanine green"
site_url = "https://matthiaskoenig.github.io/icg-model/"
site_description = "This repository provides the indocyanine green (ICG) physiologically based pharmacokinetic (PBPK) model of the ICG liver function tests: the distribution of ICG in the plasma, its hepatic uptake, its reflux into the plasma and its biliary excretion, with the effects of cirrhosis, hepatectomy, hepatic blood flow and bilirubin."
site_author = "Adrian Köller and Matthias König"

copyright = "Copyright &copy; 2021-2026 Adrian Köller and Matthias König"

# pages as `simulations.html`, so the reports which the docs workflow copies into
# the site (`simulations/`, `fit/`) do not replace the pages of the same name
use_directory_urls = false

repo_url = "https://github.com/matthiaskoenig/icg-model"
repo_name = "matthiaskoenig/icg-model"

nav = [
  { "Home" = "index.md" },
  { "Running the model" = "running.md" },
  { "Models" = "models.md" },
  { "Simulations" = "simulations.md" },
  { "Fit" = "fit.md" },
  { "Release notes" = "release-notes.md" },
]

[project.theme]
language = "en"
features = [
  "content.code.copy",
  "navigation.footer",
  "navigation.top",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "teal"
accent = "teal"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "teal"
accent = "teal"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/matthiaskoenig/icg-model"
